name: Daily Paper Checker

# =================================================================
# 1. トリガー（実行タイミング）の設定部分
# =================================================================
on:
  # 【定期自動実行】（今まで通り毎日自動で動かす設定）
  schedule:
    - cron: '0 22 * * *'  # 時間はご自身の現在の設定に合わせてください
  
  # 【手動実行（タイムマシン機能）】の設定
  # この「workflow_dispatch」というブロックを丸ごと追加します
  workflow_dispatch:
    inputs:
      target_date:  # ← この変数名は変更しないでください（Python側がこの名前で受け取ります）
        # ↓ ここはGitHubの画面に表示される説明文です。自由に書き換えてOKです！
        description: 2026-05-15
        required: false  # 空欄での実行（通常の今日付け処理）を許可するためにfalseにします
        default: ''      # デフォルトは空欄にしておきます

# =================================================================
# 2. 実際の処理内容（ジョブ）の設定部分
# =================================================================
jobs:
  paper_check_job:
    runs-on: ubuntu-latest
    steps:
      # リポジトリのコードをチェックアウト（既存のまま）
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pythonの環境構築（既存のまま）
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ライブラリのインストール（既存のまま。requirements.txt等があればそちらに合わせてください）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai arxiv requests

      # 履歴ファイルをGitHubに保存・復元するためのキャッシュ設定（既存のまま）
      # ※ もし現在history.txtの保持に別の手段（Artifactsや別のリポジトリへのpush等）を
      # 使っている場合は、ご自身の既存のステップに合わせてください。
      - name: Restore or Initialize History
        run: |
          if [ ! -f history.txt ]; then
            touch history.txt
          fi

      # 【最重要：実行コマンドの修正部分】
      # 以前は「run: python daily_paper.py」だけだった部分の末尾に、
      # 変数「${{ github.event.inputs.target_date }}」を付け加えます。
      - name: Run Paper Checker
        env:
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        # 後ろにスペースを空けて変数を置くことで、手動入力された日付（空欄なら何もなし）がPythonの引数に渡ります
        run: python daily_paper.py ${{ github.event.inputs.target_date }}
