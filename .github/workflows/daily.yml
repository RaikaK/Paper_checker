name: Daily Paper Checker Suite

# =================================================================
# 1. トリガー（実行タイミング）の設定部分
# =================================================================
on:
  # 【定期自動実行】毎日自動で動かす設定
  schedule:
    - cron: '0 22 * * *'  # 日本時間あさ7:00
  
  # 【手動実行（タイムマシン機能）】の設定
  workflow_dispatch:
    inputs:
      target_date:
        description: '取得したい過去の日付を入力（例: 2026-05-15）。今日の分を取る場合は空欄のままでOK。'
        required: false
        default: ''

# =================================================================
# 2. 実際の処理内容（ジョブ）の設定部分
# =================================================================
jobs:
  paper_check_job:
    runs-on: ubuntu-latest
    
    # 【最重要ガード】実行者がリポジトリの所有者（あなた）自身である場合のみ実行を許可
    if: github.actor == github.repository_owner

    steps:
      # リポジトリのコードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pythonの環境構築
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ライブラリのインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai arxiv requests

      # 各履歴ファイルがなければ初期化
      - name: Initialize History Files
        run: |
          [ -f history.txt ] || touch history.txt
          [ -f history_security.txt ] || touch history_security.txt

      # -----------------------------------------------------------
      # ステップ1: 総合版（通常版）の実行
      # -----------------------------------------------------------
      - name: Run Daily Paper Checker (General)
        env:
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python daily_paper.py ${{ github.event.inputs.target_date }}

      # -----------------------------------------------------------
      # ステップ2: 5分待機 ➔ ゲームAI版の実行
      # -----------------------------------------------------------
      - name: Wait 5 minutes for Game AI
        run: sleep 300  # 300秒 = 5分 (あえての短縮設定)

      - name: Run Game AI Researcher
        env:
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GAME_WEBHOOK_URL: ${{ secrets.GAME_WEBHOOK_URL }}  # ⭕️ 変数名をPython側と完全一致に修正
        run: python game_ai_researcher.py ${{ github.event.inputs.target_date }}

      # -----------------------------------------------------------
      # ステップ3: 5分待機 ➔ セキュリティ版の実行
      # -----------------------------------------------------------
      - name: Wait 5 minutes for Security
        run: sleep 300  # 300秒 = 5分 (あえての短縮設定)

      - name: Run Security Researcher
        env:
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          SECURITY_WEBHOOK_URL: ${{ secrets.SECURITY_WEBHOOK_URL }}  # ⭕️ 完璧に合っています
        run: python security_researcher.py ${{ github.event.inputs.target_date }}

      # -----------------------------------------------------------
      # ステップ4: 変更されたすべての履歴ファイルをまとめて保存
      # -----------------------------------------------------------
      - name: Commit and Push All Histories
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 履歴ファイルをステージングに追加
          git add history.txt history_security.txt
          # どちらかのファイルに変更があった場合のみコミットしてプッシュ
          git diff --cached --quiet || (git commit -m "Update paper and security history [skip ci]" && git push)
